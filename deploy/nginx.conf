server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /static/ {
        alias /home/ubuntu/apps/dulce-arte/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/apps/dulce-arte/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/apps/dulce-arte/dulcearte.sock;
    }

    error_log /var/log/nginx/dulcearte_error.log;
    access_log /var/log/nginx/dulcearte_access.log;
}
